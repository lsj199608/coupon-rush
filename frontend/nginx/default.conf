# 프론트 정적 파일 서빙 (8-1). 8-4 에서 /api·/oauth2·/login/oauth2·/ws/web-chat 프록시와 1초 캐시를 더한다
server {
    listen 8080;
    server_name _;
    server_tokens off;   # 응답 헤더·에러 페이지에 nginx 버전을 싣지 않는다

    root /usr/share/nginx/html;

    # 헬스체크 (Docker HEALTHCHECK, 8-3 readiness/liveness)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 빌드 결과는 파일 이름에 내용 해시가 들어간다 → 오래 캐시해도 새 배포 때 이름이 바뀐다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 확인 — 오래 캐시하면 새 배포 뒤에도 예전 assets 이름을 가리킨다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: /events/3 같은 화면 경로는 파일이 없으니 index.html 을 주고 React Router 가 그린다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
