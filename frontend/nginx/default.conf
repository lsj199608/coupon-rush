# 게이트웨이 (8-4): 프론트 정적 파일 + 백엔드 리버스 프록시. 브라우저에게는 전부 한 출처(http://localhost) — CORS 없음, SameSite=Strict 쿠키 그대로.
# 개발 때 Vite 프록시(frontend/vite.config.ts)가 하던 일을 그대로 옮긴다. 경로 규칙을 바꾸면 두 곳을 함께 고친다.
#
#   /api/web-chat/rooms/**, /ws/web-chat → web-chat-service:8083   (지난 대화, WebSocket)
#   /api/**, /oauth2/**, /login/oauth2/** → coupon-api:8080
#   그 밖                                   → 정적 파일 / SPA index.html
# 백엔드 주소는 Kubernetes Service 이름 (이 이미지는 클러스터 안에서만 쓴다).
# 넘기지 않는 것: /internal/**(서비스 간 내부 API), /actuator/**, mcp-server — 위 접두사에 없으면 SPA 로 떨어져 백엔드에 닿지 않는다.

# 이벤트 상세 1초 캐시 (D5 "남은 수량 실시간 푸시" 대신) — http 단계 설정이라 server 밖에 둔다 (conf.d/*.conf 는 http 블록 안에서 include 됨)
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:1m max_size=16m inactive=10s use_temp_path=off;

# WebSocket 업그레이드: Upgrade 헤더가 있으면 Connection: upgrade, 없으면 일반 요청처럼 (keep-alive 유지)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    server_tokens off;   # 응답 헤더·에러 페이지에 nginx 버전을 싣지 않는다

    root /usr/share/nginx/html;

    # 프록시 location 마다 include /etc/nginx/snippets/proxy-headers.conf (Host·X-Forwarded-* — 이유는 그 파일에)

    # 헬스체크 (Docker HEALTHCHECK, Kubernetes probe)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- web-chat-service (더 긴 경로를 /api 보다 먼저 — nginx 는 접두사 중 가장 긴 것을 고르지만 의도를 분명히) ----
    location /api/web-chat/rooms/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://web-chat-service:8083;
    }

    location = /ws/web-chat {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://web-chat-service:8083;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Origin 은 브라우저 값 그대로 넘어간다 → 채팅 서버가 허용 목록(http://localhost)과 비교
        # 하트비트 10초라 평소엔 끊기지 않지만, 응답이 없을 때 1시간까지는 연결을 유지
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- coupon-api ----
    # 이벤트 상세: 회원과 무관한 응답이라 1초 캐시. 1만 명이 보고 있어도(상세 화면 3초 폴링) coupon-api 조회는 이벤트당 초당 약 1번.
    # proxy_cache_lock: 캐시가 비었을 때 동시에 온 요청 중 하나만 백엔드로, 나머지는 그 응답을 기다린다 (캐시 만료 순간 몰림 방지)
    location ~ ^/api/coupons/[0-9]+$ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://coupon-api:8080;
        proxy_cache api_cache;
        proxy_cache_key "$request_method$uri";   # 쿼리·쿠키·Authorization 은 키에 넣지 않음 (응답이 같으므로)
        proxy_cache_valid 200 1s;                # 404 등은 캐시하지 않음
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale updating;          # 새로 받는 동안 직전 응답(최대 1초 묵음)을 준다
        # Spring Security 가 붙이는 Cache-Control: no-store 를 nginx 캐시 판단에서만 무시 (브라우저에게는 그대로 전달 → 브라우저는 캐시 안 함)
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;   # HIT / MISS / UPDATING — 확인용
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://coupon-api:8080;
    }

    # OAuth 로그인 시작(/oauth2/authorization/{제공자})과 제공자 콜백(/login/oauth2/code/{제공자}).
    # /login 전체를 넘기면 프론트 로그인 화면(/login)을 새로고침할 때 백엔드 응답이 보인다 (6단계 Vite 와 같은 이유)
    location /oauth2/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://coupon-api:8080;
    }

    location /login/oauth2/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://coupon-api:8080;
    }

    # ---- 정적 파일 (보안 헤더는 여기에만 — 백엔드 응답에는 Spring Security 가 이미 붙인다) ----
    # Vite 빌드 결과는 파일 이름에 내용 해시가 들어간다 → 오래 캐시해도 새 배포 때 이름이 바뀐다
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 확인 — 오래 캐시하면 새 배포 뒤에도 예전 assets 이름을 가리킨다
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: /events/3 같은 화면 경로는 파일이 없으니 index.html 을 주고 React Router 가 그린다
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
