# 정적 파일 응답에 붙이는 보안 헤더 (default.conf 의 정적 location 에서 include).
# 따로 파일로 둔 이유: nginx 는 location 안에 add_header 가 하나라도 있으면 바깥(server) 의 add_header 를 물려받지 않는다
# → /assets/ 처럼 Cache-Control 을 붙이는 곳마다 보안 헤더를 다시 적어야 해서, 한 곳에 모아 include 한다.
add_header X-Content-Type-Options "nosniff" always;                        # 파일 종류 추측 금지 (스크립트로 오인 실행 방지)
add_header X-Frame-Options "DENY" always;                                  # 다른 사이트가 iframe 으로 넣지 못하게 (클릭재킹)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;       # 다른 사이트로 갈 때 주소의 경로·쿼리는 보내지 않음
