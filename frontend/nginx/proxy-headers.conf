# 백엔드로 넘길 때 공통 헤더 (default.conf 의 프록시 location 마다 include).
# 따로 파일로 둔 이유: nginx 는 location 안에 proxy_set_header 가 하나라도 있으면 바깥(server) 것을 물려받지 않는다
# → WebSocket 처럼 헤더를 더 붙이는 location 에서 아래가 통째로 빠지는 것을 막으려고 한 곳에 모은다.
#
# Host 는 브라우저가 보낸 그대로(localhost) — Spring 이 OAuth redirect_uri 를 http://localhost/login/oauth2/code/{제공자} 로 만든다
#   (coupon-api SERVER_FORWARDHEADERSSTRATEGY=native 가 X-Forwarded-* 를 믿는다).
# X-Forwarded-For 는 덧붙이지 않고 **덮어쓴다**: 이 게이트웨이가 맨 앞이라 브라우저가 보낸 X-Forwarded-For 는 위조일 수 있다
#   (비로그인 검색 한도가 IP 기준). AWS 에서 앞에 로드밸런서가 생기면 real_ip 설정으로 바꾼다.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
