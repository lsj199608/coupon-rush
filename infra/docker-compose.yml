name: coupon-rush

services:
  postgres:
    image: pgvector/pgvector:pg17   # 7단계(LLM 검색)에서 쓸 pgvector 가 포함된 Postgres
    container_name: coupon-rush-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?infra/.env 에 POSTGRES_DB 를 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?infra/.env 에 POSTGRES_USER 를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env 에 POSTGRES_PASSWORD 를 설정하세요}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: coupon-rush-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1         # KRaft 모드 단일 노드 (Zookeeper 불필요)
    container_name: coupon-rush-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 2개 (7단계): 같은 브로커를 두 주소로 알려 준다
      #   PLAINTEXT://localhost:9092 — 호스트에서 실행하는 앱(bootRun 의 coupon-api·llm-service, 테스트 도구)용. 기존 그대로
      #   INTERNAL://kafka:29092     — compose 네트워크 안의 컨테이너(llm-service 이미지)용.
      #                                컨테이너가 localhost:9092 로 접속하면 자기 자신을 가리켜서 연결이 안 된다
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 데이터 위치를 볼륨 경로로 (7단계에서 수정). 이미지 기본값은 /tmp/kraft-combined-logs 라서 아래 볼륨이 쓰이지 않았고,
      # 컨테이너를 다시 만들면(설정 변경 등) 토픽·메시지·컨슈머 오프셋이 모두 사라졌다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # LLM 호출 전담 서비스 (7단계). 기본 `docker compose up -d` 에는 포함되지 않고 llm 프로필로만 뜬다:
  #   docker compose --profile llm up -d --build
  # 호스트에서 `gradlew :llm-service:bootRun` 으로 띄울 때는 이 컨테이너를 켜지 않는다 (같은 컨슈머 그룹을 나눠 갖게 됨)
  llm-service:
    profiles: ["llm"]
    build:
      context: ../backend
      dockerfile: llm-service/Dockerfile
    image: coupon-rush/llm-service:local
    container_name: coupon-rush-llm-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # .env 를 통째로 넘기지 않는다 — 이 서비스에 필요한 값만 (JWT·OAuth·DB 비밀값은 받지 않음)
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"                      # 컨테이너 안 포트 (호스트 포트 REDIS_PORT 와 무관)
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}           # 비어 있으면 fake 로 동작
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-50000}
    # ports 없음: 공개 API 가 없고 8081 은 컨테이너 안 헬스체크용
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
