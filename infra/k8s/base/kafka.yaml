# Kafka (8-2) — KRaft 단일 노드(broker + controller), compose 와 같은 이미지·설정
#
# compose 와 다른 점: 리스너가 하나 (클러스터 안 앱은 모두 kafka-0.kafka...:9092 로 접속).
# compose 는 호스트 앱용 localhost:9092 + 컨테이너용 kafka:29092 두 개였다. 클러스터 밖(PC)에서 볼 때는 kubectl port-forward 대신
# kubectl exec 로 Pod 안 도구를 쓴다 (advertised 주소가 클러스터 DNS 라 PC 에서는 접속이 이어지지 않음).
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # headless: 브로커가 자기 주소로 알려 주는 kafka-0.kafka.coupon-rush.svc.cluster.local 을 DNS 로 풀기 위해
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # ⚠ 필수: Service 이름이 kafka 라서 켜 두면 KAFKA_PORT=tcp://..., KAFKA_SERVICE_HOST=... 가 주입되고,
      # apache/kafka 이미지는 KAFKA_* 환경변수를 전부 서버 설정으로 바꾸므로(port=tcp://...) 설정이 깨진다
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60   # 로그 정리·컨트롤러 종료 시간
      securityContext:
        fsGroup: 1000   # 이미지 사용자 appuser(1000)가 데이터 폴더에 쓸 수 있게
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.coupon-rush.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # 볼륨 경로 (이미지 기본값 /tmp/kraft-combined-logs 면 Pod 를 다시 만들 때 토픽·오프셋이 사라진다 — 7단계 compose 버그와 같음)
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # JVM 힙 상한 (이미지 기본 1GB). 컨테이너 메모리 상한보다 충분히 작게
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          # 준비 확인은 포트만 (kafka-broker-api-versions.sh 는 JVM 을 띄워 몇 초씩 걸리고 메모리를 쓴다)
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
