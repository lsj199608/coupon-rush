# web-chat-service (8-3) — 이벤트 채팅 WebSocket(STOMP) + 지난 대화 API. 클러스터 안 주소 web-chat-service:8083
# 설정: ConfigMap web-chat-service-config + Secret web-chat-service (local-setup.ps1: WEB_CHAT_DB_USER/PASSWORD — coupon_rush 계정은 받지 않음)
apiVersion: v1
kind: Service
metadata:
  name: web-chat-service
spec:
  selector:
    app.kubernetes.io/name: web-chat-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-chat-service
spec:
  replicas: 1   # 2대(서버 간 전달 D3 확인)는 8-5
  selector:
    matchLabels:
      app.kubernetes.io/name: web-chat-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-chat-service
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web-chat-service
          image: coupon-rush/web-chat-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: web-chat-service-config }
            - secretRef: { name: web-chat-service }
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
