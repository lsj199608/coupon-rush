# web-chat-service (8-3) — 이벤트 채팅 WebSocket(STOMP) + 지난 대화 API. 클러스터 안 주소 web-chat-service:8083
# 설정: ConfigMap web-chat-service-config + Secret web-chat-service (local-setup.ps1: WEB_CHAT_DB_USER/PASSWORD — coupon_rush 계정은 받지 않음)
apiVersion: v1
kind: Service
metadata:
  name: web-chat-service
spec:
  selector:
    app.kubernetes.io/name: web-chat-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-chat-service
spec:
  # 2대 (8-5): 서버 간 전달은 Redis pub/sub(D3), 도배 제한도 Redis — 어느 Pod 에 붙어도 같은 방·같은 한도
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web-chat-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-chat-service
    spec:
      enableServiceLinks: false
      # coupon-api 와 같은 종료 순서. WebSocket 은 몇 시간짜리 연결이라 "끝날 때까지 기다리기"가 안 된다 —
      # 종료 때 연결이 닫히고 브라우저가 자동 재연결(D4, 새 티켓)로 살아 있는 Pod 에 붙은 뒤 지난 대화를 다시 읽는다.
      # 저장 대기열은 꺼지기 전에 한 번 저장한다(D6 WebChatHistoryWriter)
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web-chat-service
          image: coupon-rush/web-chat-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: web-chat-service-config }
            - secretRef: { name: web-chat-service }
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          ports:
            - name: http
              containerPort: 8083
          lifecycle:
            preStop:
              sleep: { seconds: 10 }   # 이유는 coupon-api.yaml — Service 에서 빠진 사실이 퍼질 때까지 평소처럼 받기
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
