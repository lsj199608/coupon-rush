# 공통 매니페스트 (8단계). 환경별 차이는 overlays/{local, aws} 에서 덮어쓴다.
#   적용: kubectl apply -k infra/k8s/overlays/local   (먼저 infra/k8s/local-setup.ps1 — 네임스페이스·Secret·ConfigMap)
#
# Namespace 는 여기에 넣지 않는다: `kubectl delete -k` 가 네임스페이스까지 지우면 그 안의 PVC 도 지워지고,
# StorageClass hostpath 는 PVC 가 지워지면 데이터도 지운다(reclaimPolicy Delete). 네임스페이스는 local-setup.ps1 이 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coupon-rush

labels:
  - pairs:
      app.kubernetes.io/part-of: coupon-rush

resources:
  # 8-2 데이터 저장소 (StatefulSet + PVC)
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  # 8-3 앱 (Deployment)
  - coupon-api.yaml
  - llm-service.yaml
  - mcp-server.yaml
  - web-chat-service.yaml
  # 8-4 입구 (Nginx: 정적 파일 + 리버스 프록시, http://localhost)
  - gateway.yaml
  # 8-5 계획된 중단에서도 최소 1대 (coupon-api·web-chat-service)
  - disruption-budgets.yaml

# 앱 설정 (비밀이 아닌 값). 비밀값은 local-setup.ps1 이 만드는 Secret(앱 이름과 같음)에.
# generator 라 이름 끝에 내용 해시가 붙는다(coupon-api-config-abc123) → 값을 바꿔 apply 하면 Deployment 가 새 이름을 가리켜 Pod 가 자동으로 다시 뜬다.
# application.yml 은 그대로 두고 환경변수로 덮어쓴다 (Spring relaxed binding: app.mcp.allowed-hosts ↔ APP_MCP_ALLOWEDHOSTS).
# 브라우저 주소는 8-4 게이트웨이(http://localhost) 기준으로 미리 맞춰 둔다.
configMapGenerator:
  - name: coupon-api-config
    literals:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0.kafka.coupon-rush.svc.cluster.local:9092
      - FRONTEND_OAUTH2_REDIRECT_URI=http://localhost/oauth/callback
      # 게이트웨이가 보내는 X-Forwarded-* 를 믿는다 (Tomcat RemoteIpValve — 사설망 주소에서 온 요청만):
      # OAuth redirect_uri 의 {baseUrl} = http://localhost, getRemoteAddr = 브라우저 IP (비로그인 검색 한도)
      - SERVER_FORWARDHEADERSSTRATEGY=native
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
  - name: llm-service-config
    literals:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0.kafka.coupon-rush.svc.cluster.local:9092
      - MCP_SERVER_URL=http://mcp-server:8082/mcp
      - LLM_PROVIDER=fake
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
  - name: mcp-server-config
    literals:
      - SERVER_ADDRESS=0.0.0.0
      # Host 헤더 허용 목록 (DNS 리바인딩 방지): 클러스터 안 이름 + port-forward 로 쓸 때의 localhost
      - APP_MCP_ALLOWEDHOSTS=mcp-server:8082,localhost:8082,127.0.0.1:8082
      - APP_MCP_COUPONAPI_BASEURL=http://coupon-api:8080
      - APP_MCP_FRONTENDBASEURL=http://localhost
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
  - name: web-chat-service-config
    literals:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_WEBCHAT_ALLOWEDORIGINS=http://localhost
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
