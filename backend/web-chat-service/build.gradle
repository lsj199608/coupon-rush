// 이벤트별 실시간 채팅방 (7단계 D). 사람 ↔ 사람 대화 — WebSocket + STOMP.
// coupon-api 안에 두지 않는 이유: WebSocket 은 연결을 오래 쥔다(스레드·메모리·파일 핸들).
// 선착순 오픈 순간 채팅 접속이 몰려도 발급 서비스의 자원을 쓰지 않게 프로세스를 나눈다 (llm-service·mcp-server 와 같은 원칙).
// 다른 모듈 중 티켓 계약(web-chat-contract)만 의존한다. DB 없음 (D6 에서 자기 DB web_chat 예정).
plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

dependencies {
	// coupon-api 가 만든 연결 티켓의 Redis 키·값 모양 (D2)
	implementation project(':web-chat-contract')

	// spring-websocket + spring-messaging(STOMP, 단순 브로커) + 내장 Tomcat
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 연결 티켓 확인 (GETDEL). D3 에서 서버 간 전달(pub/sub)에도 쓴다
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.awaitility:awaitility'   // 구독이 서버에 등록될 때까지 대기
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
