spring:
  application:
    name: mcp-server
  # infra/.env 에서 MCP_SERVICE_TOKEN, INTERNAL_API_TOKEN 을 읽는다 (작업 폴더 backend/mcp-server 기준, 없으면 무시)
  config:
    import: optional:file:../../infra/.env[.properties]

server:
  port: 8082
  # 공개 도구(검색·상세)는 인증 없이 쓸 수 있어서 이 PC 밖에서 접속하지 못하게 루프백에만 연다.
  # 컨테이너로 띄울 때(C2)는 0.0.0.0 + compose 내부 네트워크만 (호스트 포트는 열지 않음)
  address: 127.0.0.1

app:
  mcp:
    endpoint: /mcp                         # MCP Streamable HTTP 주소 (http://localhost:8082/mcp)
    # DNS 리바인딩 방지: 이 Host 헤더로 온 요청만 받는다 (악성 웹페이지가 브라우저를 통해 로컬 서버를 부르지 못하게)
    allowed-hosts: localhost:8082, 127.0.0.1:8082
    coupon-api:
      base-url: http://localhost:8080
      connect-timeout: 2s
      read-timeout: 5s
      # 챗봇(서비스 호출)의 "사용자 쿠폰" 조회에 쓰는 coupon-api 내부 API 토큰 (coupon-api 와 같은 값)
      internal-token: ${INTERNAL_API_TOKEN:}
    search:
      # coupon-api 검색이 PENDING(AI 조건 생성 중)이면 기다렸다가 결과를 한 번에 돌려준다 (서버 마감 15초 + 여유)
      wait-timeout: 20s
      poll-interval: 500ms
    # 이벤트 페이지 링크 (도구 결과에 넣는다 — 발급은 도구가 아니라 이 페이지에서)
    frontend-base-url: http://localhost:5173
    auth:
      # llm-service 챗봇이 X-Mcp-Service-Token 으로 보낼 값. 비우면 서비스 호출을 받지 않는다
      # (사람은 Authorization: Bearer {coupon-api access token} — 이 값과 무관)
      service-token: ${MCP_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
