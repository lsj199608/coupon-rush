spring:
  application:
    name: coupon-rush
  # infra/.env 를 프로퍼티로 읽어온다 (backend/ 에서 실행 기준). 없으면 무시.
  # → 비밀번호를 코드/설정 파일에 두지 않고 docker-compose 와 같은 .env 하나로 관리
  config:
    import: optional:file:../infra/.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # 초기 단계용. 스키마가 안정되면 Flyway + validate 로 전환
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # 카카오 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post   # 카카오는 secret 을 form body 로 받음
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname                # 이메일은 비즈 앱 심사가 필요해 요청하지 않음
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: nickname, email                 # 실제 제공 항목은 네이버 개발자센터 설정을 따른다
            client-name: Naver
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid 를 넣으면 OIDC 경로(OidcUserService)로 빠져 CustomOAuth2UserService 를 거치지 않는다.
            # 자체 JWT 를 발급하므로 ID 토큰은 필요 없어, 다른 제공자와 같은 OAuth2 경로로 통일한다.
            scope: profile, email
            client-name: Google
            # provider 는 Spring 내장(CommonOAuth2Provider.GOOGLE) 사용
        provider:
          kakao:   # 카카오는 Spring 내장 provider 가 아니라 직접 지정
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:   # 네이버도 내장 provider 가 없다
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response          # 실제 사용자 정보가 response 안에 중첩되어 있음

jwt:
  secret: ${JWT_SECRET}                    # 32바이트 이상. 부족하면 기동 시 실패한다
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:30m}

app:
  oauth2:
    # 로그인 성공/실패 후 돌아갈 프론트엔드 주소 (비밀값이 아니라 기본값 허용)
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always   # db, redis 상태를 개별로 확인 (상세 정보는 노출 안 함)
