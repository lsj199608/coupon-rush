spring:
  application:
    name: coupon-rush
  # infra/.env 를 프로퍼티로 읽어온다 (작업 폴더 backend/coupon-api 기준 — gradlew :coupon-api:bootRun 이 이 폴더에서 실행). 없으면 무시.
  # → 비밀번호를 코드/설정 파일에 두지 않고 docker-compose 와 같은 .env 하나로 관리
  config:
    import: optional:file:../../infra/.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway(db/migration)만 한다. Hibernate 는 엔티티와 DB 가 맞는지 검사만 하고,
      # 어긋나면 기동 시 실패한다 → 마이그레이션 누락을 바로 알 수 있다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 발급 이벤트는 유실되면 안 된다: 모든 in-sync replica 가 기록해야 성공
      acks: all
      properties:
        # 재시도로 같은 메시지가 두 번 기록되는 것을 브로커가 막는다 (PID + 시퀀스 번호). acks=all 이 전제
        enable.idempotence: true
        # idempotence 가 순서를 보장하는 최대값 (5 이하)
        max.in.flight.requests.per.connection: 5
        # 이 시간 안에 ack 를 못 받으면 실패로 확정 (API 는 5초까지만 기다리고 503)
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false   # 오프셋은 Spring 이 처리 후 커밋 (listener.ack-mode)
    listener:
      # 리스너가 정상 반환한 뒤에만 그 메시지의 오프셋을 커밋한다 (= DB 커밋 성공 후).
      # 예외면 커밋하지 않고 재시도, 재시도 소진 시 DLT 발행에 성공해야 오프셋을 넘긴다.
      ack-mode: record

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # 카카오 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post   # 카카오는 secret 을 form body 로 받음
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname                # 이메일은 비즈 앱 심사가 필요해 요청하지 않음
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: nickname, email                 # 실제 제공 항목은 네이버 개발자센터 설정을 따른다
            client-name: Naver
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid 를 넣으면 OIDC 경로(OidcUserService)로 빠져 CustomOAuth2UserService 를 거치지 않는다.
            # 자체 JWT 를 발급하므로 ID 토큰은 필요 없어, 다른 제공자와 같은 OAuth2 경로로 통일한다.
            scope: profile, email
            client-name: Google
            # provider 는 Spring 내장(CommonOAuth2Provider.GOOGLE) 사용
        provider:
          kakao:   # 카카오는 Spring 내장 provider 가 아니라 직접 지정
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:   # 네이버도 내장 provider 가 없다
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response          # 실제 사용자 정보가 response 안에 중첩되어 있음

jwt:
  secret: ${JWT_SECRET}                    # 32바이트 이상. 부족하면 기동 시 실패한다
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:14d}

app:
  kafka:
    replicas: ${KAFKA_TOPIC_REPLICAS:1}   # 로컬 단일 브로커. 운영은 3 (+ min.insync.replicas=2)
    topic:
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}   # 늘릴 수만 있다 (줄이려면 토픽 재생성). 키 = eventId 이므로 "동시에 열리는 이벤트 수" 기준
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}   # 서버 1대의 컨슈머 스레드 수. 파티션 수 이하로
      retry:                              # 일시 오류 재시도 (지수 백오프): 0.5s → 1s → 2s, 그래도 실패하면 DLT
        max-retries: 3
        initial-interval: 500ms
        multiplier: 2.0
        max-interval: 5s
  oauth2:
    # 로그인 성공/실패 후 돌아갈 프론트엔드 주소 (비밀값이 아니라 기본값 허용)
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}
  coupon:
    issue:
      # 발급 모드: async(기본, Redis 판정 → Kafka → 202) | sync(그 자리에서 DB 저장 → 201)
      mode: ${COUPON_ISSUE_MODE:async}
      # sync 모드의 재고 동시성 제어 방식: redis(기본) | conditional-update | pessimistic-lock | optimistic-lock
      strategy: ${COUPON_ISSUE_STRATEGY:redis}
      optimistic-max-attempts: 100
    reconcile:
      # 종료된 이벤트(1분 ~ 7일 전)의 Redis ↔ DB 대조를 주기적으로 실행, 불일치만 WARN 로그
      enabled: ${COUPON_RECONCILE_ENABLED:true}
      initial-delay: PT1M
      interval: PT10M
  llm:
    # LLM 요청(관리자 문구 생성)의 coupon-api 쪽 설정. LLM 키·모델·토큰 예산은 llm-service 설정이다
    request-timeout: ${LLM_REQUEST_TIMEOUT:60s}   # 이 안에 결과가 없으면 FAILED(TIMEOUT)
    publish-timeout: 5s                           # llm-requests 발행 ack 대기 (넘으면 503)
    zone: Asia/Seoul                              # 분·일 한도 창의 기준 시간대 (일 한도는 한국 자정에 초기화)
    rate-limit:
      per-minute: ${LLM_RATE_LIMIT_PER_MINUTE:5}  # 사용자별
      per-day: ${LLM_RATE_LIMIT_PER_DAY:50}
    daily-token-budget: ${LLM_DAILY_TOKEN_BUDGET:50000}   # llm-service 와 같은 값. 이미 소진이면 접수 단계에서 429
    timeout-sweep:
      enabled: true
      interval: PT30S                             # 마감 지난 PENDING 정리 주기
  auth:
    cookie:
      # refresh token 쿠키의 Secure 속성. 로컬(http)에서는 false, HTTPS 배포 시 true
      secure: ${AUTH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always   # db, redis 상태를 개별로 확인 (상세 정보는 노출 안 함)
