spring:
  application:
    name: llm-service
  # 로컬: coupon-api 와 같은 infra/.env 를 읽는다 (작업 폴더 backend/llm-service 기준). 없으면 무시.
  # compose 에서는 .env 를 통째로 넘기지 않고 이 서비스에 필요한 변수만 environment 로 넘긴다 (JWT·OAuth 비밀값은 받지 않음)
  config:
    import: optional:file:../../infra/.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        # 한 번에 1건만 가져온다 — LLM 호출이 길어서 여러 건을 가져오면 뒤의 건이 앞의 호출만큼 기다린다
        max.poll.records: 1
        # LLM 호출(최대 30초 × 재시도) 동안 poll 이 멈춰도 리밸런스되지 않게 (기본 5분 → 같은 메시지 중복 처리·중복 비용 방지)
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record   # 결과 발행 확정 후에만 오프셋 커밋

server:
  port: 8081   # actuator 헬스체크용 (공개 API 없음). coupon-api 8080 과 겹치지 않게

app:
  kafka:
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    topic:
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
  llm:
    # fake(기본) | anthropic. anthropic 이어도 LLM_API_KEY 가 비어 있으면 fake 로 동작한다
    provider: ${LLM_PROVIDER:fake}
    anthropic:
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:claude-sonnet-5-5}
      effort: low           # 짧은 문구라 생각을 적게 (출력 토큰 = 비용)
      max-tokens: 4000      # 생각 + 후보 3개(각 최대 600자). 잘리면 1회 재생성
      timeout: 15s          # 요청 1회. SDK 재시도 2회까지 ≈ 45초 + 백오프 < 요청 마감 60초
      max-retries: 2        # SDK 내장 재시도 (429·5xx·연결 오류만)
      fallbacks: true       # 서버 측 거절 대비 (Claude API 전용)
    budget:
      daily-tokens: ${LLM_DAILY_TOKEN_BUDGET:50000}   # 전체 서비스 하루 토큰(입력+출력) 상한, 한국 자정 초기화. 넘으면 BUDGET_EXCEEDED
    cache:
      enabled: true
      ttl: 24h              # 같은 입력·모델·프롬프트면 재사용 (다시 생성은 캐시를 건너뜀)
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 4
      open-duration: 30s
    consumer:
      concurrency: 2        # = 동시에 LLM 을 부르는 최대 수
    result-retention: 1d    # 처리 기록(llm:done) 보관 — 재전달돼도 LLM 을 다시 부르지 않음
    publish-timeout: 10s
    fake:
      delay: 0ms            # fake 응답 지연 (로컬에서 폴링·타임아웃 화면 확인용)
    chat:                   # 챗봇 (7단계 C2). 요청은 llm-chat-requests 토픽 — 문구 생성·검색과 다른 스레드
      concurrency: 2        # 동시에 처리하는 챗봇 질문 수 (질문 하나가 도구 호출로 수십 초 걸릴 수 있다)
      max-tool-calls: 5     # 질문 하나에서 부를 수 있는 도구 수. 넘으면 도구 없이 지금까지 결과로 답하게 한다
      turn-token-cap: 20000 # 질문 하나에 쓰는 토큰 상한 (일일 예산 50,000 중). 넘으면 도구 없이 마지막 답 1회
      max-tokens: 8000      # 모델 호출 1회의 출력 상한 (생각 + 답)
      deadline-margin: 5s   # 마감 이만큼 전에는 새 호출을 시작하지 않는다 (어차피 버려질 결과에 비용을 쓰지 않게)
      mcp:
        url: ${MCP_SERVER_URL:http://localhost:8082/mcp}
        service-token: ${MCP_SERVICE_TOKEN:}   # mcp-server 와 같은 값. 비어 있으면 챗봇은 도구를 못 써서 LLM_UNAVAILABLE
        request-timeout: 25s                   # 도구 호출 1회 (search_events 는 AI 검색을 최대 20초 기다린다)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
